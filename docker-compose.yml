# =============================================================================
# LIMAZ Expense Policy Service
#
#   cp .env.example .env
#   docker compose up
#
# That single command must start the complete application: database, API and
# web UI. From F01 onwards the API container also applies migrations and seeds
# the database on startup (see apps/api/docker-entrypoint.sh) - no second
# command is ever required.
# =============================================================================

name: limaz-expense-policy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-limaz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-limaz_dev_only_password}
      POSTGRES_DB: ${POSTGRES_DB:-limaz}
    ports:
      # Bound to 127.0.0.1, NOT 0.0.0.0. This is a local development and review
      # stack: publishing on every interface would expose a database carrying a
      # documented, well-known password to anyone on the same network.
      # 5433 rather than 5432 so it cannot collide with a local PostgreSQL.
      # Still reachable from the host, so integration tests run unchanged.
      - '127.0.0.1:${DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` is the readiness signal. A started container is not the
      # same thing as a database accepting connections.
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-limaz} -d ${POSTGRES_DB:-limaz} -q']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      # The browser origin the API expects. Any request that CARRIES an Origin
      # header must match it; requests with no Origin (server-to-server API key
      # callers) are unaffected.
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      BCRYPT_COST: ${BCRYPT_COST:-10}
      # F12 card webhook. The value below is a DEVELOPMENT key, published
      # deliberately so that one `docker compose up` still starts
      # everything on a fresh clone - the same reason this repository
      # publishes development passwords and API keys.
      #
      # It protects nothing real: it encrypts signing secrets for companies
      # that only exist in a database you seeded yourself. The env SCHEMA
      # has no default, so a deployment that does not set the variable
      # refuses to start rather than falling back to this.
      #
      # Override it in .env for anything you care about:
      #   WEBHOOK_ENCRYPTION_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-bGltYXotZGV2ZWxvcG1lbnQtd2ViaG9vay1rZXktMzI=}
      WEBHOOK_TOLERANCE_SECONDS: ${WEBHOOK_TOLERANCE_SECONDS:-300}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-5}
      WEBHOOK_CLAIM_LEASE_SECONDS: ${WEBHOOK_CLAIM_LEASE_SECONDS:-60}
      WEBHOOK_POLL_INTERVAL_MS: ${WEBHOOK_POLL_INTERVAL_MS:-1000}
      WEBHOOK_WORKER_ENABLED: ${WEBHOOK_WORKER_ENABLED:-true}
      # This compose file IS the review stack, so the sandbox is on. The
      # schema defaults it to false, so a deployment that says nothing gets
      # the safe answer.
      SANDBOX_SIMULATOR_ENABLED: ${SANDBOX_SIMULATOR_ENABLED:-true}
      # EXPLICIT opt-in. This compose file IS the development and review stack,
      # so it asks for the seed by name. A real deployment never sets this, and
      # both the entrypoint and the seed script refuse without it.
      SEED_DEV_DATA: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-limaz}:${POSTGRES_PASSWORD:-limaz_dev_only_password}@db:5432/${POSTGRES_DB:-limaz}?schema=public
    ports:
      # Exposed directly as well as through the web proxy: company backends
      # authenticate with an API key, not a cookie, so they are not bound by
      # the same-origin rule that applies to the browser.
      # Loopback only, for the same reason as the database above.
      - '127.0.0.1:${API_PORT:-3001}:3001'
    depends_on:
      db:
        # NOT the plain `depends_on` list form. That waits for the container to
        # start, not for PostgreSQL to accept connections, and is the usual
        # cause of a failed first `docker compose up` (risk R-05).
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side only. The browser never sees this address; it talks to the
      # web origin and Next proxies /api/* here (ADR-008, same-origin).
      INTERNAL_API_URL: http://api:3001
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
